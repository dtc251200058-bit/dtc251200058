services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: forum_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forum_db
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

  # 2. Giao diện quản lý MySQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: forum_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - backend
    depends_on:
      - db

  # 3. Web Server chạy PHP
  web:
    build: .
    container_name: forum_web
    volumes:
      - ./web:/var/www/html
    ports:
      - "8000:80"
    networks:
      - frontend
      - backend
    depends_on:
      - db

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: forum_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      - web

# Định nghĩa các mạng (Network Isolation)
networks:
  frontend:
  backend:

# Lưu trữ dữ liệu DB
volumes:
  db_data: