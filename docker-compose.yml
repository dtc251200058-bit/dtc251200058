services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: forum_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forum_db
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    restart: unless-stopped

  # 2. Giao diện quản lý MySQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: forum_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - backend
    depends_on:
      - db

  # 3. Web Server chạy PHP
  web:
    build: .
    container_name: forum_web
    volumes:
      - ./web:/var/www/html
    ports:
      - "8000:80"
    networks:
      - frontend
      - backend
    depends_on:
      - db

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: forum_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      - web

  # 5. cAdvisor (Giám sát tài nguyên container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: forum_cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend

  # 6. Prometheus (Thu thập metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: forum_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - frontend

  # 7. Grafana (Giao diện hiển thị)
  grafana:
    image: grafana/grafana:latest
    container_name: forum_grafana
    ports:
      - "3000:3000"
    networks:
      - frontend
    depends_on:
      - prometheus

  # 8. Loki (Quản lý và lưu trữ Log)
  loki:
    image: grafana/loki:2.9.2
    container_name: forum_loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - frontend

  # 9. Promtail (Thu gom Log qua Docker Socket)
  promtail:
    image: grafana/promtail:2.9.2
    container_name: forum_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend
    depends_on:
      - loki

# Mạng nội bộ bảo mật
networks:
  frontend:
  backend:

# Lưu trữ dữ liệu DB
volumes:
  db_data: